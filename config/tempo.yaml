stream_over_http_enabled: true

server:
  http_listen_port: 3200
  log_level: warn

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317

ingester:
  max_block_duration: 5m

compactor:
  compaction:
    block_retention: 168h

storage:
  trace:
    backend: local
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks

query_frontend:
  search:
    duration_slo: 5s

# The metrics generator is deliberately off. The plan called for span-metrics
# keyed on gen_ai.response.model, but the CLI does not emit that attribute
# (docs/SPIKE.md). Every span it produces says gen_ai.request.model=hydrafusion,
# so span-metrics would yield one meaningless series. The fusion metrics come
# from the tailer instead, which reads the models out of events.jsonl.
