apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    uid: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    jsonData:
      httpMethod: POST
      timeInterval: 15s

  - name: Tempo
    type: tempo
    uid: tempo
    access: proxy
    url: http://tempo:3200
    jsonData:
      # Streaming search uses a websocket path that provisioned dashboard panels
      # do not go through. Keeping it off makes panel queries take the same
      # route as everything else.
      streamingEnabled:
        search: false
      nodeGraph:
        enabled: false
      tracesToMetrics:
        datasourceUid: prometheus
        tags:
          - key: gen_ai.response.model
            value: model
